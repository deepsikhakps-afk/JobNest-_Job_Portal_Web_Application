<style>

/* ---------------------------------------------------

/* ---------------------------------------------------
   REUSABLE COMPONENT: Form (Login / Register)
   Bootstrap validation classes + custom JS validation
--------------------------------------------------- */
function AuthForm({ mode, onSubmit }) {
  const isRegister = mode === 'register';
  const [validated, setValidated] = useState(false);
  const [values, setValues] = useState({ name:"", email:"", phone:"", password:"", confirm:"" });
  const [errorMsg, setErrorMsg] = useState("");

  const handleChange = (e) => {
    setValues({ ...values, [e.target.name]: e.target.value });
  };

  const handleSubmit = (e) => {
    const form = e.currentTarget;
    e.preventDefault();
    e.stopPropagation();
    setErrorMsg("");

    if (form.checkValidity() === false) {
      setValidated(true);
      return;
    }

    if (isRegister && values.password !== values.confirm) {
      setErrorMsg("Passwords do not match.");
      setValidated(true);
      return;
    }

    setValidated(true);
    onSubmit({ name: values.name || values.email.split('@')[0], email: values.email });
  };

  return (
    <form noValidate className={validated ? "was-validated" : ""} onSubmit={handleSubmit}>
      {isRegister && (
        <div className="mb-3">
          <label className="form-label">Full Name</label>
          <input type="text" className="form-control" name="name" required
                 value={values.name} onChange={handleChange} placeholder="John Doe" />
          <div className="invalid-feedback">Please enter your full name.</div>
        </div>
      )}

      <div className="mb-3">
        <label className="form-label">Email address</label>
        <input type="email" className="form-control" name="email" required
               value={values.email} onChange={handleChange} placeholder="you@example.com" />
        <div className="invalid-feedback">Please enter a valid email address.</div>
      </div>

      {isRegister && (
        <div className="mb-3">
          <label className="form-label">Phone Number</label>
          <input type="tel" className="form-control" name="phone" required
                 pattern="[0-9]{10}" value={values.phone} onChange={handleChange}
                 placeholder="10-digit mobile number" />
          <div className="invalid-feedback">Please enter a valid 10-digit phone number.</div>
        </div>
      )}

      <div className="mb-3">
        <label className="form-label">Password</label>
        <input type="password" className="form-control" name="password" required minLength="6"
               value={values.password} onChange={handleChange} placeholder="Minimum 6 characters" />
        <div className="invalid-feedback">Password must be at least 6 characters.</div>
      </div>

      {isRegister && (
        <div className="mb-3">
          <label className="form-label">Confirm Password</label>
          <input type="password" className="form-control" name="confirm" required
                 value={values.confirm} onChange={handleChange} placeholder="Re-enter password" />
          <div className="invalid-feedback">Please confirm your password.</div>
        </div>
      )}

      {errorMsg && <div className="alert alert-danger py-2">{errorMsg}</div>}

      <button type="submit" className="btn btn-brand w-100 mt-2">
        {isRegister ? "Create Account" : "Login"}
      </button>
    </form>
  );
}

/* ---------------------------------------------------

/* ---------------------------------------------------

--------------------------------------------------- */
function JobFilterBar({ filters, setFilters, categories, locations }) {

    <div className="card p-3 mb-4 shadow-sm border-0">
      <div className="row g-2">
        <div className="col-md-4">
          <input
            type="text" className="form-control"
            placeholder="Search by job title, company, or skill..."

            onChange={(e)=>setFilters({...filters, search: e.target.value})}
          />
        </div>
        <div className="col-md-3">
          <select className="form-select" value={filters.category}
                  onChange={(e)=>setFilters({...filters, category: e.target.value})}>
            <option value="">All Categories</option>
            {categories.map(c=>(<option key={c} value={c}>{c}</option>))}
          </select>
        </div>
        <div className="col-md-3">
          <select className="form-select" value={filters.location}
                  onChange={(e)=>setFilters({...filters, location: e.target.value})}>
            <option value="">All Locations</option>
            {locations.map(l=>(<option key={l} value={l}>{l}</option>))}
          </select>
        </div>
        <div className="col-md-2">
          <select className="form-select" value={filters.type}
                  onChange={(e)=>setFilters({...filters, type: e.target.value})}>
            <option value="">All Types</option>
            <option>Full-time</option>
            <option>Internship</option>
            <option>Contract</option>
          </select>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------
   PAGE: Jobs listing (search + filter + JobCard render)
--------------------------------------------------- */
function JobsPage({ appliedIds, onApply }) {
  const [filters, setFilters] = useState({ search:"", category:"", location:"", type:"" });

  const categories = useMemo(()=>[...new Set(JOBS_DATA.map(j=>j.category))], []);
  const locations = useMemo(()=>[...new Set(JOBS_DATA.map(j=>j.location))], []);

  const filteredJobs = useMemo(()=>{
    return JOBS_DATA.filter(job=>{
      const s = filters.search.toLowerCase();
      const matchesSearch = !s ||
        job.title.toLowerCase().includes(s) ||
        job.company.toLowerCase().includes(s) ||
        job.tags.join(' ').toLowerCase().includes(s);
      const matchesCategory = !filters.category || job.category === filters.category;
      const matchesLocation = !filters.location || job.location === filters.location;
      const matchesType = !filters.type || job.type === filters.type;
      return matchesSearch && matchesCategory && matchesLocation && matchesType;
    });
  }, [filters]);

  return (
    <div className="container py-4">
      <div className="hero p-4 p-md-5 mb-4">
        <h2 className="fw-bold mb-2">Find a job you'll love</h2>
        <p className="mb-0 opacity-75">{JOBS_DATA.length} openings from top companies, updated daily.</p>
      </div>

      <JobFilterBar filters={filters} setFilters={setFilters} categories={categories} locations={locations} />

      <p className="text-muted">{filteredJobs.length} job(s) found</p>

      <div className="row">
        {filteredJobs.map(job=>(
          <JobCard key={job.id} job={job} onApply={onApply} applied={appliedIds.includes(job.id)} />
        ))}
        {filteredJobs.length===0 && (
          <div className="col-12 text-center text-muted py-5">
            <i className="bi bi-search fs-1 d-block mb-2"></i>
            No jobs match your filters. Try adjusting your search.
          </div>
        )}
      </div>
    </div>
  );
}

  const handleLogout = () => {
    setUser(null);
    setPage('home');
  };

  const handleApply = (job) => {
    if (appliedIds.includes(job.id)) return;
    setAppliedIds([...appliedIds, job.id]);
    setApplications([
      { id: Date.now(), jobTitle: job.title, company: job.company, appliedOn: "Today", status: "pending" },
      ...applications,
    ]);
  };

  const navigate = (target) => {
    if ((target === 'dashboard') && !user) {
      setPage('auth');
      return;
    }
    setPage(target);
  };

  return (
    <div>
      <Navbar user={user} onLogout={handleLogout} onNavigate={navigate} currentPage={page} />
      {page === 'home' && <HomePage onNavigate={navigate} />}
      {page === 'auth' && <div className="py-5"><AuthPage onAuthSuccess={handleAuthSuccess} /></div>}
      {page === 'jobs' && <JobsPage appliedIds={appliedIds} onApply={handleApply} />}
      {page === 'dashboard' && user && (
        <DashboardPage user={user} appliedIds={appliedIds} onApply={handleApply} applications={applications} />
      )}
      <footer className="text-center py-4 text-muted small">
        © 2026 JobNest. Built with React & Bootstrap.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
